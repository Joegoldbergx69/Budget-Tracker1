<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Budget Dashboard</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            /* Vibrant, bright gradient background */
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #333;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: all 0.3s ease;
        }
        .glass-input:focus {
            background: rgba(255, 255, 255, 0.8);
            outline: none;
            box-shadow: 0 0 0 3px rgba(255, 105, 135, 0.3);
        }

        /* Custom Scrollbar */
        .custom-scroll::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 105, 135, 0.6);
            border-radius: 10px;
        }
        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 105, 135, 0.9);
        }

        /* Custom Range Slider */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #fff;
            border: 3px solid var(--thumb-color, #ff6b6b);
            cursor: pointer;
            margin-top: -7px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:active {
            transform: scale(1.2);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: rgba(255,255,255,0.7);
            border-radius: 3px;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-6 lg:p-8 flex flex-col items-center justify-center">

    <div class="max-w-7xl w-full mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-8">
        
        <!-- LEFT COLUMN: Summary & Chart -->
        <div class="lg:col-span-5 flex flex-col gap-6">
            
            <!-- Header Summary -->
            <div class="glass-panel rounded-[2rem] p-6 text-center relative overflow-hidden">
                <h1 class="text-3xl font-extrabold text-gray-800 tracking-tight mb-2">Budget Planner</h1>
                <p class="text-sm font-medium text-pink-600 mb-6 uppercase tracking-wider">Shared Bachelor Life</p>
                
                <div class="grid grid-cols-3 gap-2 sm:gap-4 divide-x divide-white/50 bg-white/40 rounded-2xl p-4 shadow-sm">
                    <div class="flex flex-col">
                        <span class="text-[10px] sm:text-xs font-bold text-gray-500 uppercase">Salary (PKR)</span>
                        <span class="font-black text-gray-800 text-base sm:text-lg">60,000</span>
                    </div>
                    <div class="flex flex-col pl-2 sm:pl-4">
                        <span class="text-[10px] sm:text-xs font-bold text-gray-500 uppercase">Expenses</span>
                        <span id="totalExpenses" class="font-black text-rose-500 text-base sm:text-lg">0</span>
                    </div>
                    <div class="flex flex-col pl-2 sm:pl-4">
                        <span class="text-[10px] sm:text-xs font-bold text-gray-500 uppercase">Remaining</span>
                        <span id="remainingBalance" class="font-black text-emerald-600 text-base sm:text-lg">0</span>
                    </div>
                </div>

                <div id="warningMsg" class="mt-4 text-xs font-bold text-red-600 bg-red-100/80 rounded-lg p-2 hidden transition-all">
                    ⚠️ Budget Limit Reached! Cannot exceed 60,000 PKR.
                </div>
            </div>

            <!-- Chart Section -->
            <div class="glass-panel rounded-[2rem] p-6 flex-1 flex flex-col items-center justify-center min-h-[300px]">
                <div class="relative w-full max-w-[280px] sm:max-w-[320px] aspect-square">
                    <canvas id="budgetChart"></canvas>
                </div>
            </div>
        </div>

        <!-- RIGHT COLUMN: Adjustable Menu & Dynamic Category Creator -->
        <div class="lg:col-span-7 flex flex-col gap-6 lg:h-[calc(100vh-4rem)]">
            
            <!-- Add New Category Form -->
            <div class="glass-panel rounded-3xl p-5 shadow-md">
                <h3 class="text-lg font-bold text-gray-800 mb-3 flex items-center gap-2">
                    <svg class="w-5 h-5 text-pink-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                    Add New Expense
                </h3>
                <div class="flex flex-col sm:flex-row gap-3">
                    <input type="text" id="newCatName" placeholder="Category Name (e.g. Gym)" class="glass-input rounded-xl px-4 py-2 flex-1 text-sm font-medium placeholder-gray-500 text-gray-800">
                    <input type="number" id="newCatAmount" placeholder="Amount (PKR)" class="glass-input rounded-xl px-4 py-2 w-full sm:w-32 text-sm font-medium placeholder-gray-500 text-gray-800" min="0">
                    <button id="addCatBtn" class="bg-gradient-to-r from-pink-500 to-orange-400 hover:from-pink-600 hover:to-orange-500 text-white font-bold py-2 px-6 rounded-xl shadow-lg transition-transform transform hover:scale-105 active:scale-95">
                        Add
                    </button>
                </div>
                <div id="addError" class="text-xs text-red-600 mt-2 font-semibold hidden">Please enter a valid name and amount within budget.</div>
            </div>

            <!-- Expense List -->
            <div class="glass-panel rounded-[2rem] p-4 sm:p-6 shadow-lg flex-1 flex flex-col min-h-[400px]">
                <div class="flex justify-between items-center mb-4 px-2">
                    <h2 class="text-xl font-bold text-gray-800">Expense Breakdown</h2>
                </div>
                
                <div id="expensesList" class="flex-1 overflow-y-auto custom-scroll pr-2 space-y-3 pb-4">
                    <!-- Javascript will populate this -->
                </div>
            </div>

        </div>
    </div>

    <script>
        const SALARY = 60000;
        
        // Dynamic vibrant color palette
        const colors = [
            '#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', '#FFEEAD', 
            '#D4A5A5', '#9FA8DA', '#CE93D8', '#FFAB91', '#80CBC4', 
            '#BCAAA4', '#F48FB1', '#90CAF9', '#A5D6A7', '#FDE047',
            '#F472B6', '#C084FC', '#38BDF8', '#4ADE80', '#FB923C'
        ];

        // Initial Data based on user request (Shared bachelor living in PK)
        let expenses = [
            { id: 1, name: 'Rent', amount: 10000, color: colors[0] },
            { id: 2, name: 'Mess/Groceries', amount: 12000, color: colors[1] },
            { id: 3, name: 'Utilities', amount: 5000, color: colors[2] },
            { id: 4, name: 'Transport', amount: 6000, color: colors[3] },
            { id: 5, name: 'Mobile/Internet', amount: 1500, color: colors[4] },
            { id: 6, name: 'Dining Out/Chai', amount: 5000, color: colors[5] },
            { id: 7, name: 'Personal Care', amount: 2000, color: colors[6] }
        ];

        let donutChart;
        let nextColorIndex = 7;

        // DOM Elements
        const listContainer = document.getElementById('expensesList');
        const totalEl = document.getElementById('totalExpenses');
        const remainingEl = document.getElementById('remainingBalance');
        const warningMsg = document.getElementById('warningMsg');
        
        // Format Currency
        const formatPKR = (num) => new Intl.NumberFormat('en-PK').format(num);

        function init() {
            renderList();
            initChart();
            updateDashboard();
        }

        function renderList() {
            listContainer.innerHTML = '';
            
            if(expenses.length === 0) {
                listContainer.innerHTML = `<div class="text-center text-gray-500 py-10 font-medium text-sm">No expenses added yet.</div>`;
                return;
            }

            expenses.forEach((expense) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'bg-white/50 rounded-2xl p-4 transition-all hover:bg-white/70 border border-white/60 shadow-sm relative group';
                
                itemDiv.innerHTML = `
                    <div class="flex items-center justify-between mb-3">
                        <div class="flex items-center gap-2">
                            <div class="w-3 h-3 rounded-full" style="background-color: ${expense.color}"></div>
                            <span class="font-bold text-gray-800 text-sm sm:text-base">${expense.name}</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <input type="number" id="num_${expense.id}" value="${expense.amount}" min="0" max="${SALARY}" 
                                class="w-20 sm:w-28 text-right bg-white/60 border-none rounded-lg px-2 py-1 text-sm font-bold text-gray-800 focus:ring-2 focus:ring-pink-400 focus:outline-none">
                            <span class="text-xs font-bold text-gray-500">PKR</span>
                            <button onclick="deleteExpense(${expense.id})" class="ml-2 p-1.5 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors" title="Remove">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </div>
                    </div>
                    <div class="flex items-center w-full px-1">
                        <input type="range" id="range_${expense.id}" value="${expense.amount}" min="0" max="${SALARY}" step="500" 
                            style="--thumb-color: ${expense.color}">
                    </div>
                `;
                listContainer.appendChild(itemDiv);

                // Event Listeners for Syncing and Clamping
                const numInput = document.getElementById(`num_${expense.id}`);
                const rangeInput = document.getElementById(`range_${expense.id}`);

                const handleUpdate = (e) => {
                    let val = parseInt(e.target.value) || 0;
                    if (val < 0) val = 0;
                    
                    // Calculate what the max allowed is for this specific input
                    const currentTotalOthers = expenses.reduce((sum, item) => item.id === expense.id ? sum : sum + item.amount, 0);
                    const maxAllowed = SALARY - currentTotalOthers;
                    
                    if (val > maxAllowed) {
                        val = maxAllowed;
                        warningMsg.classList.remove('hidden');
                        setTimeout(() => warningMsg.classList.add('hidden'), 2000);
                    }

                    numInput.value = val;
                    rangeInput.value = val;
                    
                    // Update array
                    const index = expenses.findIndex(item => item.id === expense.id);
                    if(index !== -1) {
                        expenses[index].amount = val;
                        updateDashboard();
                    }
                };

                numInput.addEventListener('input', handleUpdate);
                rangeInput.addEventListener('input', handleUpdate);
            });
        }

        function updateDashboard() {
            const total = expenses.reduce((sum, item) => sum + item.amount, 0);
            const remaining = SALARY - total;

            totalEl.innerText = formatPKR(total);
            remainingEl.innerText = formatPKR(remaining);

            if (remaining <= 0) {
                remainingEl.classList.remove('text-emerald-600');
                remainingEl.classList.add('text-red-600');
            } else {
                remainingEl.classList.remove('text-red-600');
                remainingEl.classList.add('text-emerald-600');
            }

            if (donutChart) {
                donutChart.data.labels = expenses.map(e => e.name);
                donutChart.data.datasets[0].data = expenses.map(e => e.amount);
                donutChart.data.datasets[0].backgroundColor = expenses.map(e => e.color);
                
                // Show empty state in chart if no expenses
                if(expenses.length === 0) {
                    donutChart.data.labels = ['Unallocated'];
                    donutChart.data.datasets[0].data = [SALARY];
                    donutChart.data.datasets[0].backgroundColor = ['#e5e7eb']; // gray-200
                }
                
                donutChart.update();
            }
        }

        function initChart() {
            const ctx = document.getElementById('budgetChart').getContext('2d');
            donutChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: expenses.map(e => e.name),
                    datasets: [{
                        data: expenses.map(e => e.amount),
                        backgroundColor: expenses.map(e => e.color),
                        borderWidth: 2,
                        borderColor: 'rgba(255, 255, 255, 0.8)',
                        hoverOffset: 15,
                        borderRadius: 5
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '70%',
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: 'rgba(255, 255, 255, 0.9)',
                            titleColor: '#333',
                            bodyColor: '#666',
                            borderColor: 'rgba(0,0,0,0.1)',
                            borderWidth: 1,
                            padding: 12,
                            boxPadding: 6,
                            callbacks: {
                                label: function(context) {
                                    let label = context.label || '';
                                    if (label) label += ': ';
                                    if (context.raw !== null) label += formatPKR(context.raw) + ' PKR';
                                    return label;
                                }
                            }
                        }
                    },
                    animation: {
                        animateScale: true,
                        animateRotate: true
                    }
                }
            });
        }

        // Add Category Logic
        document.getElementById('addCatBtn').addEventListener('click', () => {
            const nameInput = document.getElementById('newCatName');
            const amountInput = document.getElementById('newCatAmount');
            const errorMsg = document.getElementById('addError');
            
            const name = nameInput.value.trim();
            let amount = parseInt(amountInput.value) || 0;
            
            const currentTotal = expenses.reduce((sum, item) => sum + item.amount, 0);
            
            if (!name) {
                errorMsg.innerText = "Please enter a category name.";
                errorMsg.classList.remove('hidden');
                return;
            }

            if (amount < 0) amount = 0;
            
            if (currentTotal + amount > SALARY) {
                amount = SALARY - currentTotal;
                if(amount <= 0) {
                    errorMsg.innerText = "No budget remaining to add this category!";
                    errorMsg.classList.remove('hidden');
                    return;
                }
            }

            errorMsg.classList.add('hidden');

            const newColor = colors[nextColorIndex % colors.length];
            nextColorIndex++;

            const newExpense = {
                id: Date.now(),
                name: name,
                amount: amount,
                color: newColor
            };

            expenses.push(newExpense);
            
            // Reset inputs
            nameInput.value = '';
            amountInput.value = '';

            renderList();
            updateDashboard();
            
            // Scroll to bottom of list
            setTimeout(() => {
                listContainer.scrollTop = listContainer.scrollHeight;
            }, 100);
        });

        // Global accessible function for inline onclick
        window.deleteExpense = function(id) {
            expenses = expenses.filter(e => e.id !== id);
            renderList();
            updateDashboard();
        };

        // Initialize on load
        window.onload = init;

    </script>
</body>
</html>
